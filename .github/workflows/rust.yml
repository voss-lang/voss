name: rust

permissions:
  contents: read

on:
  push:
    branches: [master]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'contracts/**'
      - 'voss/**'
      - 'scripts/generate_sdk_events.py'
      - 'pyproject.toml'
      - '.github/workflows/rust.yml'
  pull_request:
    branches: [master]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'contracts/**'
      - 'voss/**'
      - 'scripts/generate_sdk_events.py'
      - 'pyproject.toml'
      - '.github/workflows/rust.yml'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Voss Python package (for the SDK test server)
        run: pip install -e .
      - name: cargo test --workspace
        run: cargo test --workspace --no-fail-fast
        env:
          VOSS_LIVE_SMOKES: '0'
