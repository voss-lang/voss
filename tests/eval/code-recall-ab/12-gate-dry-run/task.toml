prompt = '''Is there a way to check whether a card would pass a board gate without actually moving it or recording a transition? Where is it? Answer with the location as `path:line` (repo-relative path and the line number of the relevant code).'''
mode = "edit"
rubric = '''PASS if the final answer cites voss/harness/board/machine.py lines 565-615 as `path:line` and correctly names Board.dry_run_gate. FAIL if no citation falls in that range, or the answer describes different code.'''
judge_inputs = ["final"]
corpus = "pinned"

[[checks]]
type = "cmd"
run = '''grep -Eq 'voss/harness/board/machine\.py:(56[5-9]|5[7-9][0-9]|60[0-9]|61[0-5])([^0-9]|$)' .voss-eval-final.txt'''
