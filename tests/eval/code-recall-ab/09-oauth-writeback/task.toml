prompt = '''After Voss refreshes a Claude subscription login token, where does it save the new token, and where is that logic? Answer with the location as `path:line` (repo-relative path and the line number of the relevant code).'''
mode = "edit"
rubric = '''PASS if the final answer cites voss/harness/auth.py lines 186-231 as `path:line` and correctly names refresh_anthropic and its write-back to the original credential source. FAIL if no citation falls in that range, or the answer describes different code.'''
judge_inputs = ["final"]
corpus = "pinned"

[[checks]]
type = "cmd"
run = '''grep -Eq 'voss/harness/auth\.py:(18[6-9]|19[0-9]|2[0-2][0-9]|23[0-1])([^0-9]|$)' .voss-eval-final.txt'''
