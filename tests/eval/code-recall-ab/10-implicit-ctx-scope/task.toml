prompt = '''If a .voss program calls ask(...) outside any ctx block, what token budget does the compiled Python get, and where does the compiler decide that? Answer with the location as `path:line` (repo-relative path and the line number of the relevant code).'''
mode = "edit"
rubric = '''PASS if the final answer cites voss/codegen.py lines 1175-1191 as `path:line` and correctly names the code generator's implicit ContextScope wrapper with the 4000-token budget. FAIL if no citation falls in that range, or the answer describes different code.'''
judge_inputs = ["final"]
corpus = "pinned"

[[checks]]
type = "cmd"
run = '''grep -Eq 'voss/codegen\.py:(117[5-9]|118[0-9]|119[0-1])([^0-9]|$)' .voss-eval-final.txt'''
