prompt = '''If two Voss processes write project memory at the same time, what happens to the write that cannot get the lock? Show me where that is handled. Answer with the location as `path:line` (repo-relative path and the line number of the relevant code).'''
mode = "edit"
rubric = '''PASS if the final answer cites voss/harness/memory_store.py lines 194-210 as `path:line` and correctly names MemoryStore._lock and its skip-on-contention behavior. FAIL if no citation falls in that range, or the answer describes different code.'''
judge_inputs = ["final"]
corpus = "pinned"

[[checks]]
type = "cmd"
run = '''grep -Eq 'voss/harness/memory_store\.py:(19[4-9]|20[0-9]|210)([^0-9]|$)' .voss-eval-final.txt'''
