prompt = '''When Voss runs as an MCP server over stdio and a client sends one enormous request line, how does the server respond, and where is that handled? Answer with the location as `path:line` (repo-relative path and the line number of the relevant code).'''
mode = "edit"
rubric = '''PASS if the final answer cites voss/harness/mcp/server.py lines 51-97 or voss/harness/mcp/server.py lines 214-231 as `path:line` and correctly names the stdio serve loop or line reader that rejects oversized lines. FAIL if no citation falls in that range, or the answer describes different code.'''
judge_inputs = ["final"]
corpus = "pinned"

[[checks]]
type = "cmd"
run = '''grep -Eq '(voss/harness/mcp/server\.py:(5[1-9]|[6-8][0-9]|9[0-7])|voss/harness/mcp/server\.py:(21[4-9]|22[0-9]|23[0-1]))([^0-9]|$)' .voss-eval-final.txt'''
