prompt = '''The Go TUI shows a word-level diff on edit tool cards. What stops that diff from blowing up on large edits, and where is it? Answer with the location as `path:line` (repo-relative path and the line number of the relevant code).'''
mode = "edit"
rubric = '''PASS if the final answer cites tui/diff.go lines 17-79 as `path:line` and correctly names diffTokenCap and the wordDiff cap check in tui/diff.go. FAIL if no citation falls in that range, or the answer describes different code.'''
judge_inputs = ["final"]
corpus = "pinned"

[[checks]]
type = "cmd"
run = '''grep -Eq 'tui/diff\.go:(1[7-9]|[2-7][0-9])([^0-9]|$)' .voss-eval-final.txt'''
