prompt = '''In the Rust renderer, where is the end-of-turn status line built (the line with the token count, cost and context percent)? Answer with the location as `path:line` (repo-relative path and the line number of the relevant code).'''
mode = "edit"
rubric = '''PASS if the final answer cites crates/voss-render/src/status_line.rs lines 11-42 or crates/voss-render/src/status_line.rs lines 52-63 as `path:line` and correctly names the status_line.rs format function (or its thousands formatter). FAIL if no citation falls in that range, or the answer describes different code.'''
judge_inputs = ["final"]
corpus = "pinned"

[[checks]]
type = "cmd"
run = '''grep -Eq '(crates/voss-render/src/status_line\.rs:(1[1-9]|[2-3][0-9]|4[0-2])|crates/voss-render/src/status_line\.rs:(5[2-9]|6[0-3]))([^0-9]|$)' .voss-eval-final.txt'''
