prompt = '''The TypeScript SDK launches `voss serve` and reads a handshake line before connecting. Where is that handshake read and validated? Answer with the location as `path:line` (repo-relative path and the line number of the relevant code).'''
mode = "edit"
rubric = '''PASS if the final answer cites sdk/typescript/src/launcher/launcher.ts lines 105-172 as `path:line` and correctly names readHandshake/parseHandshake in the TypeScript launcher. FAIL if no citation falls in that range, or the answer describes different code.'''
judge_inputs = ["final"]
corpus = "pinned"

[[checks]]
type = "cmd"
run = '''grep -Eq 'sdk/typescript/src/launcher/launcher\.ts:(10[5-9]|1[1-6][0-9]|17[0-2])([^0-9]|$)' .voss-eval-final.txt'''
