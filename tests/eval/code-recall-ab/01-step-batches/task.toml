prompt = '''When the agent executes a multi-step plan, some tool calls run concurrently and others run one at a time. Where does Voss decide which plan steps get grouped into a concurrent batch? Answer with the location as `path:line` (repo-relative path and the line number of the relevant code).'''
mode = "edit"
rubric = '''PASS if the final answer cites voss/harness/agent.py lines 1699-1759 as `path:line` and correctly names the scheduler that partitions plan steps into parallel read batches and serial mutating steps (_run_step_loop). FAIL if no citation falls in that range, or the answer describes different code.'''
judge_inputs = ["final"]
corpus = "pinned"

[[checks]]
type = "cmd"
run = '''grep -Eq 'voss/harness/agent\.py:(1699|17[0-5][0-9])([^0-9]|$)' .voss-eval-final.txt'''
