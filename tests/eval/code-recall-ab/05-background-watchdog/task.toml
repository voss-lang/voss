prompt = '''A background shell job that hangs without printing anything eventually gets killed. Where is that enforced? Answer with the location as `path:line` (repo-relative path and the line number of the relevant code).'''
mode = "edit"
rubric = '''PASS if the final answer cites voss/harness/lifecycle.py lines 226-289 as `path:line` and correctly names the background-job supervisor's no-output watchdog (_supervise). FAIL if no citation falls in that range, or the answer describes different code.'''
judge_inputs = ["final"]
corpus = "pinned"

[[checks]]
type = "cmd"
run = '''grep -Eq 'voss/harness/lifecycle\.py:(22[6-9]|2[3-8][0-9])([^0-9]|$)' .voss-eval-final.txt'''
