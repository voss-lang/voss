prompt = '''How does `voss serve` check the bearer token without breaking server-sent event streams? Point me to the implementation. Answer with the location as `path:line` (repo-relative path and the line number of the relevant code).'''
mode = "edit"
rubric = '''PASS if the final answer cites voss/harness/server/app.py lines 76-101 as `path:line` and correctly names the raw ASGI bearer middleware (_BearerASGI). FAIL if no citation falls in that range, or the answer describes different code.'''
judge_inputs = ["final"]
corpus = "pinned"

[[checks]]
type = "cmd"
run = '''grep -Eq 'voss/harness/server/app\.py:(7[6-9]|[8-9][0-9]|10[0-1])([^0-9]|$)' .voss-eval-final.txt'''
