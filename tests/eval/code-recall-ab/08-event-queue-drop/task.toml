prompt = '''In the HTTP server, what happens to session events when the client is slow and the event queue fills up? Where is that code? Answer with the location as `path:line` (repo-relative path and the line number of the relevant code).'''
mode = "edit"
rubric = '''PASS if the final answer cites voss/harness/server/renderer.py lines 58-85 as `path:line` and correctly names the server renderer's enqueue path that drops the oldest event. FAIL if no citation falls in that range, or the answer describes different code.'''
judge_inputs = ["final"]
corpus = "pinned"

[[checks]]
type = "cmd"
run = '''grep -Eq 'voss/harness/server/renderer\.py:(5[8-9]|[6-7][0-9]|8[0-5])([^0-9]|$)' .voss-eval-final.txt'''
