prompt = '''Moving a card into a full column on the team board fails. Where is that check, and what does the board record about the refused move? Answer with the location as `path:line` (repo-relative path and the line number of the relevant code).'''
mode = "edit"
rubric = '''PASS if the final answer cites voss/harness/board/machine.py lines 422-445 as `path:line` and correctly names the WIP enforcement step in Board.move. FAIL if no citation falls in that range, or the answer describes different code.'''
judge_inputs = ["final"]
corpus = "pinned"

[[checks]]
type = "cmd"
run = '''grep -Eq 'voss/harness/board/machine\.py:(42[2-9]|43[0-9]|44[0-5])([^0-9]|$)' .voss-eval-final.txt'''
