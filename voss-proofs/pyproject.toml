[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voss-proofs"
version = "0.1.0"
description = "Evaluation, benchmarking and research harness for the Voss ecosystem"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.6,<3.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
proofs = "voss_proofs.cli:main"

[tool.setuptools.packages.find]
include = ["voss_proofs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
